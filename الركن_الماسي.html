<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الركن الماسي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Aref+Ruqaa:wght@700&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg-1:#050912; --bg-2:#0c1730; --bg-3:#101e40;
    --gold:#e6c581; --gold-soft:#f6e6bd; --gold-deep:#a97c2e; --gold-rose:#eccb9a;
    --ink:#f6f1e4; --dim:#93a0bd; --hair:rgba(230,197,129,.22);
    --panel:rgba(9,16,34,.55); --panel-line:rgba(230,197,129,.28);
    --shadow-card:0 40px 80px -20px rgba(0,0,0,.65), 0 0 0 1px rgba(230,197,129,.08) inset;
  }
  *{box-sizing:border-box;}
  html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px);}
  body{
    margin:0; min-height:100%; color:var(--ink); font-family:'Cairo',sans-serif;
    background:
      radial-gradient(120% 85% at 50% 45%, transparent 60%, rgba(0,0,0,.4) 100%),
      radial-gradient(60% 45% at 50% 8%, rgba(230,197,129,.18), transparent 70%),
      radial-gradient(80% 60% at 90% 100%, rgba(30,60,120,.28), transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
    display:flex; justify-content:center; overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }

  .grain{position:fixed; inset:0; pointer-events:none; opacity:.05; mix-blend-mode:overlay;
    background-image:radial-gradient(#fff 1px, transparent 1px); background-size:3px 3px;}

  .bokeh{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .bokeh i{position:absolute; border-radius:50%; filter:blur(2px);
    background:radial-gradient(circle at 35% 30%, rgba(246,230,189,.9), rgba(230,197,129,0) 70%);
    animation:twinkle 5s ease-in-out infinite;}
  .bokeh i:nth-child(1){width:5px;height:5px; top:12%; left:16%; animation-delay:.2s;}
  .bokeh i:nth-child(2){width:3px;height:3px; top:22%; left:82%; animation-delay:1.4s;}
  .bokeh i:nth-child(3){width:4px;height:4px; top:68%; left:9%; animation-delay:2.1s;}
  .bokeh i:nth-child(4){width:6px;height:6px; top:78%; left:88%; animation-delay:.8s;}
  .bokeh i:nth-child(5){width:3px;height:3px; top:40%; left:92%; animation-delay:2.8s;}
  .bokeh i:nth-child(6){width:4px;height:4px; top:6%; left:60%; animation-delay:1.9s;}
  @keyframes twinkle{0%,100%{opacity:0; transform:scale(.6);} 50%{opacity:.9; transform:scale(1.15);}}
  @media (prefers-reduced-motion:reduce){ .bokeh, .ring, .sweets, .gold-sash, .link-transition img{animation:none !important;}
    .wrap > *{animation:none !important; opacity:1 !important;} }

  /* ===== شعار متحرك عند فتح رابط ===== */
  .link-transition{position:fixed; inset:0; z-index:999; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(120% 100% at 50% 50%, rgba(12,23,48,.94), rgba(5,9,18,.985));
    opacity:0; pointer-events:none; transition:opacity .35s ease;}
  .link-transition.show{opacity:1; pointer-events:all;}
  .link-transition .lt-logo{width:110px; height:110px; object-fit:contain;
    filter:drop-shadow(0 0 26px rgba(230,197,129,.55));}
  .link-transition.show .lt-logo{animation:logoSpinOpen .85s cubic-bezier(.3,.7,.3,1) forwards;}
  @keyframes logoSpinOpen{
    0%{transform:scale(.65) rotate(0deg); opacity:0;}
    35%{opacity:1;}
    100%{transform:scale(1.18) rotate(430deg); opacity:0;}
  }
  .link-transition span{font-family:'Cormorant Garamond',serif; font-style:italic; letter-spacing:2px;
    color:var(--gold-soft); font-size:12.5px; opacity:0; animation:ltTextIn .5s ease .25s forwards;}
  @keyframes ltTextIn{from{opacity:0; transform:translateY(6px);} to{opacity:.85; transform:translateY(0);}}

  /* ===== بطاقة الزجاجة الخلفية ===== */
  .bottle-bg{position:fixed; inset:0; margin:auto; width:210px; height:560px; z-index:0;
    pointer-events:none; opacity:.07; mix-blend-mode:screen;}
  .bottle-bg svg{width:100%; height:100%;}

  /* ===== الوشاح الذهبي المتحرك ===== */
  .gold-sash{position:fixed; top:0; left:-45%; width:32%; height:100%; z-index:2;
    pointer-events:none; opacity:0; filter:blur(1px); mix-blend-mode:screen;
    background:linear-gradient(100deg,
      transparent 0%,
      rgba(230,197,129,0) 12%,
      rgba(246,230,189,.30) 46%,
      rgba(230,197,129,.5) 50%,
      rgba(246,230,189,.30) 54%,
      rgba(230,197,129,0) 88%,
      transparent 100%);
    animation:sashSweep 9s ease-in-out infinite;}
  @keyframes sashSweep{
    0%{left:-45%; opacity:0;}
    6%{opacity:1;}
    46%{left:112%; opacity:1;}
    58%{left:112%; opacity:0;}
    100%{left:-45%; opacity:0;}
  }

  .sweets{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0;}
  .sweets span{position:absolute; bottom:-60px; opacity:0; font-size:20px;
    filter:drop-shadow(0 0 6px rgba(230,197,129,.35)); animation:floatUp linear infinite;}
  .sweets span:nth-child(1){left:8%; font-size:18px; animation-duration:19s; animation-delay:0s;}
  .sweets span:nth-child(2){left:24%; font-size:24px; animation-duration:24s; animation-delay:4s;}
  .sweets span:nth-child(3){left:48%; font-size:16px; animation-duration:21s; animation-delay:8s;}
  .sweets span:nth-child(4){left:66%; font-size:22px; animation-duration:26s; animation-delay:2s;}
  .sweets span:nth-child(5){left:84%; font-size:18px; animation-duration:20s; animation-delay:6s;}
  .sweets span:nth-child(6){left:36%; font-size:15px; animation-duration:23s; animation-delay:11s;}
  @keyframes floatUp{
    0%{transform:translateY(0) rotate(0deg); opacity:0;}
    8%{opacity:.6;}
    50%{transform:translateY(-52vh) rotate(180deg); opacity:.6;}
    92%{opacity:0;}
    100%{transform:translateY(-105vh) rotate(360deg); opacity:0;}
  }

  .burst{position:fixed; z-index:20; pointer-events:none; width:0; height:0;}
  .burst i{position:absolute; top:0; left:0; width:6px; height:6px; margin:-3px;
    background:linear-gradient(135deg,var(--gold-soft),var(--gold)); border-radius:1px;
    transform:rotate(45deg); animation:sparkOut .7s ease-out forwards;}
  @keyframes sparkOut{
    0%{transform:translate(0,0) rotate(45deg) scale(1); opacity:1;}
    100%{transform:translate(var(--dx),var(--dy)) rotate(220deg) scale(.2); opacity:0;}
  }

  .wrap{width:100%; max-width:440px; padding:46px 26px 32px; position:relative; z-index:1;
    margin:26px 14px; border-radius:30px; background:var(--panel);
    border:1px solid var(--panel-line); box-shadow:var(--shadow-card);
    backdrop-filter:blur(20px) saturate(150%); -webkit-backdrop-filter:blur(20px) saturate(150%);
    overflow:hidden;}
  .wrap::before{content:"";position:absolute; inset:0 0 auto 0; height:2px;
    background:linear-gradient(90deg,transparent,var(--gold-soft),var(--gold),var(--gold-soft),transparent);
    opacity:.9;}
  .wrap::after{content:"";position:absolute; inset:-40% -40% auto auto; width:60%; padding-top:60%;
    background:radial-gradient(circle, rgba(230,197,129,.10), transparent 70%); pointer-events:none;}
  .wrap > *{position:relative; z-index:1;}
  .wrap > .kicker, .wrap > .medal, .wrap > h1, .wrap > .sub, .wrap > .divider,
  .wrap > .lede, .wrap > .dock, .wrap > .cta, .wrap > footer{
    opacity:0; animation:riseIn .75s cubic-bezier(.2,.7,.2,1) forwards;}
  .wrap > .kicker{animation-delay:.05s}
  .wrap > .medal{animation-delay:.15s}
  .wrap > h1{animation-delay:.28s}
  .wrap > .sub{animation-delay:.36s}
  .wrap > .divider{animation-delay:.44s}
  .wrap > .lede{animation-delay:.5s}
  .wrap > .dock{animation-delay:.6s}
  .wrap > .cta{animation-delay:.7s}
  .wrap > footer{animation-delay:.8s}
  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  .kicker{text-align:center; font-size:10px; letter-spacing:5px; text-transform:uppercase;
    color:var(--gold); font-weight:700; margin-bottom:28px; opacity:.9; position:relative;
    padding-bottom:12px;}
  .kicker::after{content:"";position:absolute; bottom:0; left:50%; transform:translateX(-50%);
    width:34px; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent);}

  .medal{position:relative; width:230px; height:230px; margin:0 auto 22px;}
  .ring{position:absolute; inset:-14px; border-radius:50%;
    border:1px dashed var(--hair); animation:spin 34s linear infinite;}
  .ring.ring2{inset:-26px; border-color:rgba(230,197,129,.12); animation-duration:50s; animation-direction:reverse;}
  .ring.ring3{position:absolute; inset:-6px; border-radius:50%; padding:1px;
    background:conic-gradient(from 0deg, var(--gold-soft), transparent 30%, var(--gold) 55%, transparent 80%, var(--gold-soft));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; animation:spin 12s linear infinite; opacity:.8;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .medal-glow{position:absolute; inset:8%; border-radius:50%;
    background:radial-gradient(circle, rgba(230,197,129,.4), transparent 70%); filter:blur(20px);}
  .medal img{position:relative; width:100%; height:100%; object-fit:contain;
    filter:drop-shadow(0 10px 26px rgba(0,0,0,.55)) drop-shadow(0 0 24px rgba(230,197,129,.25));}

  h1{text-align:center; margin:0 0 6px; font-family:'Aref Ruqaa',serif; font-weight:700;
    font-size:clamp(34px,10vw,46px); line-height:1.3; letter-spacing:.5px;
    background:linear-gradient(180deg,var(--gold-soft) 10%,var(--gold) 50%,var(--gold-deep) 95%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 18px rgba(230,197,129,.28));}
  .sub{text-align:center; font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:15px; color:var(--dim); letter-spacing:1.5px; text-transform:uppercase; margin:0 0 22px;}

  .divider{display:flex; align-items:center; justify-content:center; gap:10px; margin:0 0 24px;}
  .divider .line{width:64px; height:1px; background:linear-gradient(90deg,transparent,var(--hair));}
  .divider .line.r{transform:scaleX(-1);}
  .divider .dot{width:6px; height:6px; background:linear-gradient(135deg,var(--gold-soft),var(--gold-deep));
    transform:rotate(45deg); opacity:.95; box-shadow:0 0 10px rgba(230,197,129,.6);
    animation:twinkle 3.4s ease-in-out infinite;}

  .lede{text-align:center; font-size:13.5px; line-height:2.1; color:var(--dim);
    max-width:300px; margin:0 auto 30px; font-weight:500;}

  .dock{display:flex; justify-content:center; gap:16px; margin-bottom:26px;}
  .dock a{display:flex; flex-direction:column; align-items:center; gap:8px; text-decoration:none; color:var(--ink);}
  .dock .bubble{width:58px; height:58px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--hair); background:linear-gradient(160deg, rgba(230,197,129,.08), rgba(255,255,255,.02));
    box-shadow:0 10px 24px rgba(0,0,0,.35);
    transition:transform .3s cubic-bezier(.2,.7,.2,1), border-color .3s ease, background .3s ease, box-shadow .3s ease;}
  .dock a:hover .bubble{transform:translateY(-5px) scale(1.05); border-color:var(--gold);
    background:linear-gradient(160deg, rgba(230,197,129,.24), rgba(255,255,255,.04));
    box-shadow:0 14px 30px rgba(0,0,0,.45), 0 0 18px rgba(230,197,129,.35);}
  .dock .bubble svg{width:22px; height:22px; color:var(--gold);}
  .dock span{font-size:10px; letter-spacing:1.5px; color:var(--dim); text-transform:uppercase;}

  .cta{display:block; position:relative; text-align:center; text-decoration:none;
    padding:17px 20px; border-radius:14px; font-weight:800; font-size:14.5px; letter-spacing:1px;
    color:#1a1508; background:linear-gradient(120deg,var(--gold-soft),var(--gold),var(--gold-deep));
    background-size:220% 100%; animation:sheen 6s ease-in-out infinite; cursor:pointer; border:none; width:100%; font-family:inherit;
    box-shadow:0 16px 34px -8px rgba(230,197,129,.5), 0 0 0 1px rgba(255,255,255,.15) inset;
    overflow:hidden; transition:transform .2s ease, box-shadow .2s ease;}
  .cta::before{content:"";position:absolute; inset:0; transform:translateX(-120%) skewX(-20deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);
    animation:foilSweep 3.2s ease-in-out infinite;}
  @keyframes foilSweep{0%,60%,100%{transform:translateX(-120%) skewX(-20deg);} 80%{transform:translateX(120%) skewX(-20deg);}}
  @keyframes sheen{0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;}}
  .cta:hover{box-shadow:0 20px 40px -6px rgba(230,197,129,.65), 0 0 0 1px rgba(255,255,255,.2) inset;}
  .cta:active{transform:translateY(1px);}

  footer{text-align:center; margin-top:32px; padding-top:20px; position:relative;}
  footer::before{content:"";position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:80px; height:1px; background:linear-gradient(90deg,transparent,var(--hair),transparent);}
  footer .glyph{color:var(--gold); font-size:13px; opacity:.85; margin-bottom:9px;
    text-shadow:0 0 10px rgba(230,197,129,.5);}
  footer p{margin:0; font-size:9.5px; letter-spacing:2.5px; color:var(--dim); opacity:.7;}

  .toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(16px);
    background:linear-gradient(120deg,var(--gold-soft),var(--gold)); color:#1a1508; padding:12px 20px;
    border-radius:12px; font-size:12.5px; font-weight:700; box-shadow:0 14px 30px rgba(0,0,0,.4);
    z-index:10; opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease; max-width:86%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:360px){ .wrap{padding:32px 16px;} .medal{width:190px; height:190px;} }
</style>
</head>

  <div class="toast" id="toast" role="status" aria-live="polite">💎 المنيو قريباً... طوّلوا بالكم شوي</div>

  <!-- شاشة انتقال: الشعار يدور ثم يفتح الرابط -->
  <div class="link-transition" id="linkTransition" aria-hidden="true">
    <img class="lt-logo" alt="" />
    <span>الركن الماسي</span>
  </div>

  <script>
    const menuBtn = document.getElementById('menuBtn');
    const toast = document.getElementById('toast');
    let t;
    menuBtn.addEventListener('click', () => {
      clearTimeout(t);
      toast.classList.add('show');
      t = setTimeout(() => toast.classList.remove('show'), 2600);
    });

    function spawnBurst(x, y){
      const burst = document.createElement('div');
      burst.className = 'burst';
      burst.style.left = x + 'px';
      burst.style.top = y + 'px';
      const n = 8;
      for (let i = 0; i < n; i++){
        const p = document.createElement('i');
        const angle = (Math.PI * 2 * i) / n + (Math.random() * 0.4 - 0.2);
        const dist = 30 + Math.random() * 26;
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        p.style.animationDelay = (Math.random() * 0.05) + 's';
        burst.appendChild(p);
      }
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 800);
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.target.closest('a, button')) return;
      spawnBurst(e.clientX, e.clientY);
    });

    // شعار يدور ثم يفتح الرابط
    const linkTransition = document.getElementById('linkTransition');
    const ltLogo = linkTransition.querySelector('.lt-logo');
    const medalImgEl = document.querySelector('.medal img');
    if (medalImgEl) ltLogo.src = medalImgEl.src;

    document.querySelectorAll('.dock a').forEach((link) => {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        const href = this.href;
        linkTransition.classList.remove('show');
        void linkTransition.offsetWidth; // إعادة تشغيل الأنيميشن
        linkTransition.classList.add('show');
        setTimeout(() => {
          window.open(href, '_blank', 'noopener');
          setTimeout(() => linkTransition.classList.remove('show'), 200);
        }, 700);
      });
    });
  </script>
</body>
</html>
